name: Backend CI/CD

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend.sln

      - name: Test
        if: github.event_name == 'pull_request'
        run: dotnet test Backend.sln --no-restore

      - name: Build
        run: dotnet build Backend.sln --no-restore --configuration Release

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend.sln

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(
            dotnet msbuild Restaurant.System.Api/Restaurant.System.Api.csproj \
              -t:GetBuildVersion \
              -getProperty:BuildVersionSimple \
            | jq -r '.Properties.BuildVersionSimple'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Backend version: $VERSION"

      - name: Publish
        run: |
          dotnet publish \
            Restaurant.System.Api/Restaurant.System.Api.csproj \
            --configuration Release \
            --no-restore \
            --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ steps.version.outputs.version }}
          path: ./publish